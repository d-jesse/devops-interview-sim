<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — DevOps Interview Sim</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  try {
    const t = localStorage.getItem('dis_theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch {}
</script>
<style>
  :root {
    --bg: #0a0f0d;
    --bg-grad: radial-gradient(circle at 20% -10%, #132019 0%, #0a0f0d 55%);
    --panel: #121a16;
    --panel-2: #19241e;
    --border: #28362e;
    --text: #e8ece9;
    --text-dim: #8ea295;
    --accent: #22c55e;
    --accent-2: #0d9488;
    --good: #34d399;
    --warn: #f0b429;
    --bad: #ef5b5b;
    --radius: 14px;
  }
  :root[data-theme="light"] {
    --bg: #f2f7f3;
    --bg-grad: radial-gradient(circle at 20% -10%, #ffffff 0%, #eef6f0 55%);
    --panel: #ffffff;
    --panel-2: #eef6f0;
    --border: #d9e6dc;
    --text: #15231b;
    --text-dim: #5c7267;
    --accent: #16a34a;
    --accent-2: #0d7a62;
    --good: #198754;
    --warn: #b9790a;
    --bad: #d13c3c;
  }
  :root[data-theme="light"] .card {
    box-shadow: 0 1px 3px rgba(20,25,35,0.06), 0 1px 2px rgba(20,25,35,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg) var(--bg-grad);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  a { color: var(--accent); text-decoration: none; }
  .hidden { display: none !important; }
  .wrap { width: 100%; max-width: 400px; }
  .topline { text-align: center; margin-bottom: 18px; }
  .topline a { font-size: 13px; color: var(--text-dim); font-weight: 600; }
  .topline a:hover { color: var(--accent); }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 28px; }
  .brand-mark { width: 28px; height: 28px; display: block; }
  .brand-name { font-weight: 700; font-size: 15px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 30px;
  }
  .card h1 { font-size: 20px; margin: 0 0 6px; text-align: center; }
  .card .sub { font-size: 13.5px; color: var(--text-dim); text-align: center; margin: 0 0 24px; }
  .field-label {
    font-size: 12.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .text-input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    padding: 11px 14px;
    border-radius: 9px;
    margin-bottom: 16px;
    font-family: inherit;
  }
  .text-input:focus { outline: none; border-color: var(--accent); }
  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary:hover { opacity: 0.92; }
  .btn-secondary {
    width: 100%;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }
  .btn-secondary:hover { border-color: var(--accent); }
  .switch { font-size: 13.5px; color: var(--text-dim); text-align: center; margin: 20px 0 0; }
  .error-card {
    margin-bottom: 16px;
    color: var(--bad);
    background: rgba(239,91,91,0.1);
    border: 1px solid rgba(239,91,91,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
  }
  .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: var(--text-dim); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topline"><a href="/">&larr; Back to home</a></div>
  <div class="brand">
    <img class="brand-mark" src="/favicon.svg" alt="">
    <div class="brand-name">DevOps Interview Sim</div>
  </div>
  <div class="card">
    <h1 id="title">Sign in</h1>
    <p class="sub" id="subtitle">Save your interview history across visits.</p>

    <div id="error" class="error-card hidden"></div>

    <div id="name-field" class="hidden">
      <div class="field-label">Name</div>
      <input type="text" id="name" class="text-input" placeholder="Your name">
    </div>
    <div class="field-label">Email</div>
    <input type="email" id="email" class="text-input" placeholder="you@example.com">
    <div class="field-label">Password</div>
    <input type="password" id="password" class="text-input" placeholder="••••••••">

    <button class="btn-primary" id="submit-btn">Sign in</button>

    <div class="divider hidden" id="google-divider">or</div>
    <button class="btn-secondary hidden" id="google-btn">Continue with Google</button>

    <p class="switch" id="switch-line">
      Don't have an account? <a href="#" id="switch-link">Create one</a>
    </p>
  </div>
</div>

<script>
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  const params = new URLSearchParams(window.location.search);
  let mode = params.get('mode') === 'register' ? 'register' : 'login';
  const nextPath = params.get('next') && params.get('next').startsWith('/') ? params.get('next') : '/app.html';

  function render() {
    document.getElementById('title').textContent = mode === 'login' ? 'Sign in' : 'Create account';
    document.getElementById('subtitle').textContent = mode === 'login'
      ? 'Save your interview history across visits.'
      : 'Takes a few seconds — no verification email.';
    document.getElementById('submit-btn').textContent = mode === 'login' ? 'Sign in' : 'Create account';
    document.getElementById('name-field').classList.toggle('hidden', mode === 'login');
    document.getElementById('switch-line').innerHTML = mode === 'login'
      ? `Don't have an account? <a href="#" id="switch-link">Create one</a>`
      : `Already have an account? <a href="#" id="switch-link">Sign in</a>`;
    document.getElementById('switch-link').onclick = (e) => {
      e.preventDefault();
      mode = mode === 'login' ? 'register' : 'login';
      render();
    };
    document.getElementById('error').classList.add('hidden');
  }

  document.getElementById('google-btn').onclick = () => {
    window.location.href = `/api/auth/google/login?next=${encodeURIComponent(nextPath)}`;
  };

  document.getElementById('submit-btn').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const name = document.getElementById('name').value.trim();
    const errBox = document.getElementById('error');
    errBox.classList.add('hidden');

    const path = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
    const body = mode === 'login' ? { email, password } : { email, password, name };

    try {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || 'Something went wrong');
      window.location.href = nextPath;
    } catch (e) {
      errBox.textContent = e.message;
      errBox.classList.remove('hidden');
    }
  };

  (async () => {
    try {
      const [meRes, cfgRes] = await Promise.all([fetch('/api/auth/me'), fetch('/api/auth/config')]);
      const me = await meRes.json();
      if (me.user) {
        window.location.href = nextPath;
        return;
      }
      const cfg = await cfgRes.json();
      if (cfg.google_enabled) {
        document.getElementById('google-btn').classList.remove('hidden');
        document.getElementById('google-divider').classList.remove('hidden');
      }
    } catch {}
  })();

  render();
</script>
</body>
</html>
