<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History — DevOps Interview Sim</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  try {
    const t = localStorage.getItem('dis_theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch {}
</script>
<style>
  :root {
    --bg: #0a0f0d;
    --bg-grad: radial-gradient(circle at 20% -10%, #132019 0%, #0a0f0d 55%);
    --panel: #121a16;
    --panel-2: #19241e;
    --border: #28362e;
    --text: #e8ece9;
    --text-dim: #8ea295;
    --accent: #22c55e;
    --accent-2: #0d9488;
    --good: #34d399;
    --warn: #f0b429;
    --bad: #ef5b5b;
    --radius: 14px;
  }
  :root[data-theme="light"] {
    --bg: #f2f7f3;
    --bg-grad: radial-gradient(circle at 20% -10%, #ffffff 0%, #eef6f0 55%);
    --panel: #ffffff;
    --panel-2: #eef6f0;
    --border: #d9e6dc;
    --text: #15231b;
    --text-dim: #5c7267;
    --accent: #16a34a;
    --accent-2: #0d7a62;
    --good: #198754;
    --warn: #b9790a;
    --bad: #d13c3c;
  }
  :root[data-theme="light"] .card {
    box-shadow: 0 1px 3px rgba(20,25,35,0.06), 0 1px 2px rgba(20,25,35,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg) var(--bg-grad);
    color: var(--text);
  }
  a { color: var(--accent); text-decoration: none; }
  .shell { max-width: 820px; margin: 0 auto; padding: 36px 24px 90px; }
  .hidden { display: none !important; }
  .topline { font-size: 13px; color: var(--text-dim); font-weight: 600; margin-bottom: 14px; }
  .topline a:hover { color: var(--accent); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
  .brand-mark { width: 30px; height: 30px; flex-shrink: 0; display: block; }
  .brand-name { font-weight: 700; font-size: 15px; }
  .theme-toggle {
    margin-left: auto;
    width: 36px; height: 36px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .theme-toggle:hover { border-color: var(--accent); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 30px;
  }
  .btn {
    display: inline-flex;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 10px;
    cursor: pointer;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
  }
  .attempt-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 14px;
  }
  .attempt-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    cursor: pointer;
  }
  .attempt-meta { font-size: 13px; color: var(--text-dim); }
  .attempt-date { font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .attempt-score {
    flex-shrink: 0;
    font-size: 20px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 999px;
  }
  .attempt-score.good { background: rgba(52,211,153,0.15); color: var(--good); }
  .attempt-score.mid { background: rgba(240,180,41,0.15); color: var(--warn); }
  .attempt-score.low { background: rgba(239,91,91,0.15); color: var(--bad); }
  .attempt-detail {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    gap: 14px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-q { font-size: 13.5px; line-height: 1.4; }
  .detail-cat { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
  .detail-chip {
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .detail-chip.good { background: rgba(52,211,153,0.15); color: var(--good); }
  .detail-chip.mid { background: rgba(240,180,41,0.15); color: var(--warn); }
  .detail-chip.low { background: rgba(239,91,91,0.15); color: var(--bad); }
  .empty-state { color: var(--text-dim); font-size: 14px; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<div class="shell">
  <div class="topline"><a href="/app.html">&larr; Back to app</a></div>
  <div class="brand">
    <img class="brand-mark" src="/favicon.svg" alt="">
    <div class="brand-name">Your interview history</div>
    <button class="secondary hidden" id="logout-btn" type="button" style="margin-left:auto; padding:7px 14px; border:1px solid var(--border); border-radius:9px; background:transparent; color:var(--text-dim); cursor:pointer;">Log out</button>
    <button class="theme-toggle" id="theme-toggle" title="Toggle light / dark">🌙</button>
  </div>

  <div id="gate" class="card">
    <p id="gate-message">Checking your sign-in…</p>
    <a class="btn hidden" id="gate-signin-btn" href="/signin.html?next=/history.html">Sign in</a>
  </div>

  <div id="list" class="hidden"></div>
</div>

<script>
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('theme-toggle').textContent = theme === 'light' ? '☀️' : '🌙';
    try { localStorage.setItem('dis_theme', theme); } catch {}
  }
  document.getElementById('theme-toggle').onclick = () => {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(current === 'light' ? 'dark' : 'light');
  };
  applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function scoreClass(score) {
    return score >= 8 ? 'good' : score >= 5 ? 'mid' : 'low';
  }

  function formatDate(iso) {
    try {
      return new Date(iso.replace(' ', 'T') + 'Z').toLocaleString(undefined, {
        dateStyle: 'medium', timeStyle: 'short',
      });
    } catch {
      return iso;
    }
  }

  function renderAttempts(attempts) {
    const list = document.getElementById('list');
    if (!attempts.length) {
      list.innerHTML = '<div class="card"><p class="empty-state">No interviews yet — finish one and it\'ll show up here.</p></div>';
      return;
    }
    list.innerHTML = attempts.map((a, idx) => {
      const avg = a.avg_score;
      const cls = typeof avg === 'number' ? scoreClass(avg) : 'low';
      const rows = a.questions.map(q => {
        if (typeof q.score !== 'number') {
          return `
            <div class="detail-row">
              <div class="detail-q"><div class="detail-cat">${escapeHtml(q.category)}</div>${escapeHtml(q.prompt)}</div>
              <div class="detail-chip low">Error</div>
            </div>`;
        }
        return `
          <div class="detail-row">
            <div class="detail-q"><div class="detail-cat">${escapeHtml(q.category)}</div>${escapeHtml(q.prompt)}</div>
            <div class="detail-chip ${scoreClass(q.score)}">${q.score}/10</div>
          </div>`;
      }).join('');

      return `
        <div class="attempt-card">
          <div class="attempt-head" data-idx="${idx}">
            <div class="attempt-meta">
              <div class="attempt-date">${formatDate(a.created_at)}</div>
              ${a.length} question${a.length === 1 ? '' : 's'} · ${escapeHtml(a.model)} · ${a.grading_mode === 'end' ? 'graded at end' : 'graded live'}
            </div>
            <div class="attempt-score ${cls}">${typeof avg === 'number' ? avg.toFixed(1) : '—'}</div>
          </div>
          <div class="attempt-detail hidden" id="detail-${idx}">${rows}</div>
        </div>
      `;
    }).join('');

    list.querySelectorAll('.attempt-head').forEach(el => {
      el.onclick = () => {
        document.getElementById(`detail-${el.dataset.idx}`).classList.toggle('hidden');
      };
    });
  }

  async function init() {
    const gate = document.getElementById('gate');
    const gateMessage = document.getElementById('gate-message');
    const gateSignin = document.getElementById('gate-signin-btn');

    let me;
    try {
      me = await (await fetch('/api/auth/me')).json();
    } catch {
      me = { user: null };
    }

    if (!me.user) {
      gateMessage.textContent = 'Sign in to see your saved interview results.';
      gateSignin.classList.remove('hidden');
      return;
    }

    const logoutBtn = document.getElementById('logout-btn');
    logoutBtn.classList.remove('hidden');
    logoutBtn.onclick = async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/index.html';
    };

    const res = await fetch('/api/attempts');
    if (!res.ok) {
      gateMessage.textContent = 'Could not load your history — try refreshing.';
      return;
    }
    const attempts = await res.json();
    gate.classList.add('hidden');
    document.getElementById('list').classList.remove('hidden');
    renderAttempts(attempts);
  }

  init();
</script>
</body>
</html>
