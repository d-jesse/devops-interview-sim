<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevOps Interview Sim</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --panel-2: #1e232b;
    --border: #2a3039;
    --text: #e6e8eb;
    --text-dim: #9aa4b2;
    --accent: #5b8def;
    --good: #3ecf8e;
    --warn: #f0b429;
    --bad: #ef5b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { max-height: 240px; }
  }
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0;
  }
  .sidebar h1 {
    font-size: 15px;
    padding: 0 16px 12px;
    margin: 0;
    color: var(--text-dim);
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .category { margin-bottom: 4px; }
  .category-name {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .question-item {
    padding: 8px 16px 8px 24px;
    font-size: 13.5px;
    cursor: pointer;
    color: var(--text);
    border-left: 2px solid transparent;
    line-height: 1.4;
  }
  .question-item:hover { background: var(--panel-2); }
  .question-item.active {
    border-left-color: var(--accent);
    background: var(--panel-2);
    color: var(--accent);
  }
  .main {
    padding: 32px 40px;
    max-width: 820px;
  }
  .empty-state {
    color: var(--text-dim);
    font-size: 15px;
    margin-top: 80px;
    text-align: center;
  }
  .category-tag {
    display: inline-block;
    font-size: 12px;
    color: var(--accent);
    background: rgba(91,141,239,0.12);
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .question-prompt {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.4;
    margin: 0 0 20px;
  }
  textarea {
    width: 100%;
    min-height: 220px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: "SF Mono", Menlo, monospace;
    padding: 14px;
    resize: vertical;
    line-height: 1.5;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .actions { margin-top: 14px; display: flex; align-items: center; gap: 12px; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 7px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .status { color: var(--text-dim); font-size: 13.5px; }
  .feedback-card {
    margin-top: 28px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
  }
  .score-row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; }
  .score { font-size: 34px; font-weight: 700; }
  .score.good { color: var(--good); }
  .score.mid { color: var(--warn); }
  .score.low { color: var(--bad); }
  .verdict { font-size: 15px; color: var(--text-dim); }
  .score-bar-track {
    height: 6px;
    background: var(--panel-2);
    border-radius: 999px;
    overflow: hidden;
    margin: 10px 0 18px;
  }
  .score-bar-fill { height: 100%; border-radius: 999px; }
  h3.section-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin: 18px 0 8px;
  }
  ul.point-list { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.6; }
  ul.point-list.strengths li::marker { color: var(--good); }
  ul.point-list.gaps li::marker { color: var(--bad); }
  .feedback-text { font-size: 14.5px; line-height: 1.6; margin-top: 4px; }
  .error-card {
    margin-top: 20px;
    color: var(--bad);
    background: rgba(239,91,91,0.1);
    border: 1px solid rgba(239,91,91,0.3);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13.5px;
  }
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <h1>DevOps Interview Sim</h1>
    <div id="category-list"></div>
  </div>
  <div class="main" id="main">
    <div class="empty-state">Pick a question from the left to begin.</div>
  </div>
</div>

<script>
const categoryListEl = document.getElementById('category-list');
const mainEl = document.getElementById('main');
let categories = [];
let activeQuestionId = null;

async function loadCategories() {
  const res = await fetch('/api/categories');
  categories = await res.json();
  renderSidebar();
}

function renderSidebar() {
  categoryListEl.innerHTML = '';
  for (const cat of categories) {
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    const nameDiv = document.createElement('div');
    nameDiv.className = 'category-name';
    nameDiv.textContent = cat.name;
    catDiv.appendChild(nameDiv);
    for (const q of cat.questions) {
      const item = document.createElement('div');
      item.className = 'question-item';
      item.dataset.id = q.id;
      item.textContent = q.prompt;
      item.onclick = () => selectQuestion(cat, q);
      catDiv.appendChild(item);
    }
    categoryListEl.appendChild(catDiv);
  }
}

function markActive(id) {
  document.querySelectorAll('.question-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
}

function selectQuestion(cat, q) {
  activeQuestionId = q.id;
  markActive(q.id);
  mainEl.innerHTML = `
    <div class="category-tag">${cat.name}</div>
    <p class="question-prompt">${escapeHtml(q.prompt)}</p>
    <textarea id="answer-box" placeholder="Type your answer as you would say it out loud in an interview..."></textarea>
    <div class="actions">
      <button id="submit-btn">Submit answer</button>
      <span class="status" id="status-text"></span>
    </div>
    <div id="feedback-slot"></div>
  `;
  document.getElementById('submit-btn').onclick = submitAnswer;
  document.getElementById('answer-box').focus();
}

async function submitAnswer() {
  const btn = document.getElementById('submit-btn');
  const statusText = document.getElementById('status-text');
  const feedbackSlot = document.getElementById('feedback-slot');
  const answer = document.getElementById('answer-box').value;

  if (!answer.trim()) {
    statusText.textContent = 'Write an answer first.';
    return;
  }

  btn.disabled = true;
  statusText.textContent = 'Grading on the Mac Studio... (can take up to a minute on larger models)';
  feedbackSlot.innerHTML = '';

  try {
    const res = await fetch('/api/grade', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question_id: activeQuestionId, answer }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || 'Grading failed');
    }
    const result = await res.json();
    renderFeedback(feedbackSlot, result);
    statusText.textContent = '';
  } catch (e) {
    feedbackSlot.innerHTML = `<div class="error-card">${escapeHtml(e.message)}</div>`;
    statusText.textContent = '';
  } finally {
    btn.disabled = false;
  }
}

function renderFeedback(slot, result) {
  const score = result.score ?? 0;
  const scoreClass = score >= 8 ? 'good' : score >= 5 ? 'mid' : 'low';
  const barColor = score >= 8 ? 'var(--good)' : score >= 5 ? 'var(--warn)' : 'var(--bad)';
  const strengths = (result.strengths || []).map(s => `<li>${escapeHtml(s)}</li>`).join('');
  const gaps = (result.gaps || []).map(g => `<li>${escapeHtml(g)}</li>`).join('');

  slot.innerHTML = `
    <div class="feedback-card">
      <div class="score-row">
        <span class="score ${scoreClass}">${score}/10</span>
        <span class="verdict">${escapeHtml(result.verdict || '')}</span>
      </div>
      <div class="score-bar-track">
        <div class="score-bar-fill" style="width:${score * 10}%; background:${barColor};"></div>
      </div>
      ${strengths ? `<h3 class="section-label">What you got right</h3><ul class="point-list strengths">${strengths}</ul>` : ''}
      ${gaps ? `<h3 class="section-label">What was missing</h3><ul class="point-list gaps">${gaps}</ul>` : ''}
      <h3 class="section-label">Feedback</h3>
      <p class="feedback-text">${escapeHtml(result.feedback || '')}</p>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadCategories();
</script>
</body>
</html>
